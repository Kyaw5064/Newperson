name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo SDK 52 package versions
        run: |
          npx expo install --fix
          npm ls expo expo-font expo-modules-core @expo/vector-icons || true
        env:
          CI: 1

      - name: Run tests
        run: node tests/run-tests.mjs

      - name: Set app version code (always higher → installs as an update)
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.android.versionCode=100+Number(process.env.RUN);fs.writeFileSync('app.json',JSON.stringify(j,null,2));console.log(j.expo.version, j.expo.android.versionCode)"
          echo "APP_VER=$(node -p "require('./app.json').expo.version")" >> $GITHUB_ENV
        env:
          RUN: ${{ github.run_number }}

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Tune Gradle (memory + phone CPU types)
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
          cat android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Newperson-v${APP_VER}-b${{ github.run_number }}.apk"
          ls -la dist

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Newperson-APK
          path: dist/*.apk

      - name: Publish GitHub Release (download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}-b${{ github.run_number }}
          name: Newperson v${{ env.APP_VER }} (build ${{ github.run_number }})
          files: dist/*.apk
          make_latest: true
          body: |
            📱 Android APK — Assets ထဲက `.apk` ကိုနှိပ်ပြီး ဒေါင်းလုဒ်ဆွဲ၊ ဖွင့်ပြီး Install လုပ်ပါ။
            (ပထမဆုံးအကြိမ်မှာ "Install unknown apps" ကို ခွင့်ပြုပေးရပါမယ်)
